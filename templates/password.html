<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Hamro Market</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .profile-container {
            max-width: 500px;
            margin: 40px auto;
            background: var(--base-white);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--nature-green);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .section-title {
            color: var(--leaf-green);
            margin-bottom: 15px;
        }
        .password-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .password-form input {
            padding: 10px;
            border: 1px solid var(--neutral-slate);
            border-radius: 5px;
        }
        .btn-update {
            padding: 12px 20px;
            background: var(--leaf-green);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
        }
    </style>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    {% include '_header.html' %}

    <div class="container profile-container">
        <div class="profile-header">
            <h2>Change Password</h2>
        </div>

        <div class="password-form">
            <input type="password" id="current-password" placeholder="Enter current password">
            <input type="password" id="new-password" placeholder="Enter new password (min 6 chars)">
            <input type="password" id="confirm-password" placeholder="Confirm new password">
            <button class="btn-update" onclick="changePassword()">Update Password</button>
        </div>
    </div>

    <!-- Cart Drawer required for Cart link in dropdown -->
    

    <script src="/static/js/main.js"></script>
    <script>
        function changePassword() {
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (!currentPassword) {
                alert('Please enter your current password.');
                return;
            }
            if (newPassword.length < 6) {
                alert('New password must be at least 6 characters long.');
                return;
            }
            if (newPassword !== confirmPassword) {
                alert('New passwords do not match.');
                return;
            }

            fetch('/api/profile/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    current_password: currentPassword, 
                    new_password: newPassword 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Password updated successfully!');
                    document.getElementById('current-password').value = '';
                    document.getElementById('new-password').value = '';
                    document.getElementById('confirm-password').value = '';
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert('An error occurred.');
            });
        }
    </script>
</body>
</html>
