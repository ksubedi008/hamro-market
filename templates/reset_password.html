<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Hamro Market</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            background: var(--base-white);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .auth-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--neutral-slate);
            border-radius: 5px;
        }
        .btn-full {
            width: 100%;
            padding: 12px;
            background: var(--leaf-green);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .message {
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    {% include '_header.html' %}

    <div class="container">
        <div class="auth-container">
            <h2>Enter OTP</h2>
            <p style="text-align: center; margin-bottom: 20px; color: #666;">Enter the 6-digit OTP sent to you and your new password.</p>
            
            <div id="status-msg" class="message"></div>
            
            <form id="reset-form" onsubmit="resetPassword(event)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="r-email">
                <div class="form-group">
                    <label>6-Digit OTP</label>
                    <input type="text" id="r-otp" required maxlength="6" pattern="\d{6}">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="r-password" required minlength="6">
                </div>
                <button type="submit" class="btn-full" id="submit-btn">Reset Password</button>
            </form>
            
            <a href="/login" style="display: block; text-align: center; margin-top: 20px;">Back to Login</a>
        </div>
    </div>

    <script>
        // Get email from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('r-email').value = email;
        } else {
            window.location.href = '/forgot-password'; // redirect back if no email
        }

        async function resetPassword(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('status-msg');
            const email = document.getElementById('r-email').value;
            const otp = document.getElementById('r-otp').value;
            const new_password = document.getElementById('r-password').value;
            
            btn.disabled = true;
            btn.innerText = 'Resetting...';
            
            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, new_password })
                });
                const data = await res.json();
                
                if (data.success) {
                    msg.style.color = 'green';
                    msg.innerText = data.message;
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    msg.style.color = 'red';
                    msg.innerText = data.message;
                    btn.disabled = false;
                    btn.innerText = 'Reset Password';
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.innerText = 'Network error occurred.';
                btn.disabled = false;
                btn.innerText = 'Reset Password';
            }
        }
    </script>
</body>
</html>
