<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Hamro Market</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    {% include '_header.html' %}

    <div class="container">
        <h2 style="margin-bottom: 30px;">Billing Details</h2>
        <div class="checkout-grid">
            <div>
                <form id="checkout-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="fullName" required>
                    </div>

                    <div class="form-group">
                        <label>Email address *</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="text" id="phone" required placeholder="10 digits">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Province *</label>
                            <select id="province" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                                <option value="" disabled selected>Select Province</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>District *</label>
                            <select id="district" required disabled style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: #f9f9f9;">
                                <option value="" disabled selected>Select District</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Municipality *</label>
                        <select id="municipality" required disabled style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: #f9f9f9;">
                            <option value="" disabled selected>Select Municipality</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ward No. & Tol / House Address *</label>
                        <input type="text" id="ward_tol" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Nearest Landmark / Delivery Directions (Optional)</label>
                        <input type="text" id="landmark">
                    </div>

                    <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">PROCEED TO ESEWA</button>
                </form>
            </div>
            
            <div class="order-summary">
                <h3>Your order</h3>
                <div style="border-bottom: 1px solid #ccc; padding-bottom: 15px; margin-bottom: 15px;">
                    <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px;">
                        <span>Product</span>
                        <span>Subtotal</span>
                    </div>
                    <div id="checkout-summary">
                        <!-- Items injected here by JS -->
                    </div>
                </div>
                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem;">
                    <span>Total</span>
                    <span>Rs <span id="checkout-total">0.00</span></span>
                </div>
                <div style="margin-top: 20px; font-size: 0.9rem; color: #666;">
                    Pay via eSewa. Your personal data will be used to process your order, support your experience throughout this website.
                </div>
            </div>
        </div>
    </div>
    
    {% include '_footer.html' %}

    <script src="/static/js/checkout.js"></script>
</body>
</html>
