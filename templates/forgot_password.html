<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Hamro Organic</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            background: var(--base-white);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .auth-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--neutral-slate);
            border-radius: 5px;
        }
        .btn-full {
            width: 100%;
            padding: 12px;
            background: var(--leaf-green);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .message {
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    {% include '_header.html' %}

    <div class="container">
        <div class="auth-container">
            <h2>Reset Password</h2>
            <p style="text-align: center; margin-bottom: 20px; color: #666;">Enter your email and phone number to receive a recovery OTP.</p>
            
            <div id="status-msg" class="message"></div>
            
            <form id="forgot-form" onsubmit="requestOTP(event)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="f-email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="f-phone" required>
                </div>
                <button type="submit" class="btn-full" id="submit-btn">Send OTP</button>
            </form>
            
            <a href="/login" style="display: block; text-align: center; margin-top: 20px;">Back to Login</a>
        </div>
    </div>

    <script>
        async function requestOTP(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('status-msg');
            const email = document.getElementById('f-email').value;
            const phone = document.getElementById('f-phone').value;
            
            btn.disabled = true;
            btn.innerText = 'Sending...';
            
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, phone })
                });
                const data = await res.json();
                
                if (data.success) {
                    msg.style.color = 'green';
                    msg.innerText = data.message;
                    setTimeout(() => {
                        window.location.href = '/reset-password?email=' + encodeURIComponent(email);
                    }, 2000);
                } else {
                    msg.style.color = 'red';
                    msg.innerText = data.message;
                    btn.disabled = false;
                    btn.innerText = 'Send OTP';
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.innerText = 'Network error occurred.';
                btn.disabled = false;
                btn.innerText = 'Send OTP';
            }
        }
    </script>
</body>
</html>
